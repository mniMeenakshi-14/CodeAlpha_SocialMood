{% extends "base.html" %}
{% block title %}Login 🔑 SocialMood{% endblock %}

{% block content %}
<div class="card auth">
  <h2>👋 Welcome back! 🥳</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">🔑 Login 🚀</button>
  </form>
  <p class="meta">🆕 New here? <a href="{% url 'register' %}">Create an account 🎊</a></p>
</div>
{% endblock %}
