{% extends "base.html" %}
{% block title %}Sign up 🎊 SocialMood{% endblock %}

{% block content %}
<div class="card auth">
  <h2>🎉 Join SocialMood! 😍</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">🎊 Sign up ✨</button>
  </form>
  <p class="meta">🙋 Already have an account? <a href="{% url 'login' %}">Login 🔑</a></p>
</div>
{% endblock %}
